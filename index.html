let az=40,el=24,dist=1.55,taz=40,tel=24,tdist=1.55,lt=performance.now();

const ptr=new Map();let pd=0;
const pdist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';if(ptr.size===2)pd=pdist()});

function frame(t){
const dt=Math.min(0.05,(t-lt)/1000);lt=t;

const tp=P.PHI*Math.PI/180+(drive?Math.sin(t/1000*6.28)*.012:0),ts=P.S/100;
if(Math.abs(tp-cur.phi)>1e-4||Math.abs(ts-cur.s)>1e-4){cur.phi+=(tp-cur.phi)*0.3;cur.s+=(ts-cur.s)*0.3;pose()}
else if(cur.phi!==tp||cur.s!==ts){cur.phi=tp;cur.s=ts;pose()}

el+=(tel-el)*0.14;dist+=(tdist-dist)*0.14;

gc.position.copy(cam.position).sub(tgt).setLength(8);gc.up.copy(cam.up);gc.lookAt(0,0,0);
ren.autoClear=false;ren.clearDepth();ren.setScissorTest(true);ren.setViewport(W-gs-8,8,gs,gs);ren.setScissor(W-gs-8,8,gs,gs);ren.render(gScene,gc);ren.setScissorTest(false);ren.autoClear=true;
requestAnimationFrame(frame)}
